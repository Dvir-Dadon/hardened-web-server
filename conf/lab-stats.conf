# /etc/lab-stats.conf - settings for /usr/local/sbin/lab-stats
# The installer never overwrites this file once it exists.

# Where the public JSON goes (must be inside the lab web root).
OUTPUT=/var/www/lab/data/stats.json
# Private state: 30 days of hourly COUNTS only (no IP addresses). Not web-accessible.
STATE=/var/lib/lab-stats/history.json

# Older file first. All virtual hosts write here.
ACCESS_LOGS=/var/log/nginx/access.log.1 /var/log/nginx/access.log
F2B_LOGS=/var/log/fail2ban.log.1 /var/log/fail2ban.log
# Same unit as ~/security-check.sh (journalctl -u ssh), so the numbers match.
SSH_UNIT=ssh

# Traffic from these networks is ignored completely (your own admin traffic).
# Filled in by install.sh from local.env (HOME_NET, SERVER_IP).
# The server IP is excluded too (checks it makes to its own public name).
EXCLUDE_NETS=__HOME_NET__ __SERVER_IP__/32 127.0.0.0/8 ::1/128

# Used for the "daily" buckets.
TZ=Asia/Jerusalem
HISTORY_DAYS=30

# A tried username or a scanned path is shown on the page only if this many DIFFERENT
# IPs sent it. Stops a single attacker from writing words of his choice onto your page.
MIN_SOURCES=3
