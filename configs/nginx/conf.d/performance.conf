# compression for text files (html is always compressed by default)
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# browser cache lifetime by content type
map $sent_http_content_type $static_expires {
    default             off;
    ~^text/html         epoch;
    ~^application/json  epoch;
    ~^text/css          epoch;
    ~javascript         epoch;
    ~^image/            30d;
    ~^audio/            30d;
}
expires $static_expires;
